name: Hephaestus CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  # =============================================================
  # Job 1: Test & Build Go Backend
  # =============================================================
  backend:
    name: Backend Test, Security & Build
    # Ubuntu 24.04's native PostgreSQL client major matches the PG16 test service.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hcp_audit
          POSTGRES_PASSWORD: isolated-ci-test-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U hcp_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Install PostgreSQL backup and restore clients
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client

      - name: Go Vet & Lint
        run: go vet ./...

      - name: Static correctness and unused private code checks
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Test with race detection
        run: go test -race ./...
        env:
          HCP_AUDIT_POSTGRES: '1'
          HCP_AUDIT_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          HCP_AUDIT_POSTGRES_USER: hcp_audit
          HCP_AUDIT_POSTGRES_PASSWORD: isolated-ci-test-password
          HCP_AUDIT_REQUIRE_DUMP: '1'

      - name: Scan reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Compile Backend Binary
        run: CGO_ENABLED=0 go build -ldflags="-w -s" -o bin/hephaestus ./cmd/server

  # =============================================================
  # Job 2: Test & Build Vue 3 Frontend
  # =============================================================
  frontend:
    name: Frontend Lint & Build (Vue 3 + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: npm ci

      - name: Test frontend terminal clipboard shortcuts
        working-directory: ./web
        run: npm test

      - name: Compile Vue 3 SPA Bundle
        working-directory: ./web
        run: npm run build

      - name: Audit frontend dependencies
        working-directory: ./web
        run: npm audit --audit-level=moderate

  # =============================================================
  # Job 3: Docker Multi-Arch Build (Backend & Frontend)
  # =============================================================
  docker:
    name: Build and Scan ${{ matrix.image }} (${{ matrix.arch }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
        arch: [amd64, arm64]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Arch
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build loadable architecture-specific image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: hephaestus-${{ matrix.image }}:audit

      - name: Validate Nginx configuration in final image
        if: matrix.image == 'frontend'
        run: docker run --rm --add-host engine:127.0.0.1 hephaestus-frontend:audit nginx -t

      - name: Validate bundled PostgreSQL dump clients
        if: matrix.image == 'backend'
        run: >-
          docker run --rm --entrypoint sh hephaestus-backend:audit -c
          'pg_dump16 --version && /usr/libexec/postgresql17/pg_dump --version &&
          /usr/libexec/postgresql18/pg_dump --version && pg_dump --version'

      - name: Scan final image OS and application dependencies
        run: |
          mkdir -p audit-results
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/audit-results:/reports" \
            aquasec/trivy:0.76.2 image --scanners vuln \
            --severity MEDIUM,HIGH,CRITICAL --exit-code 1 \
            --format json --output /reports/image.json \
            hephaestus-${{ matrix.image }}:audit

      - name: Upload image vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ matrix.image }}-${{ matrix.arch }}
          path: audit-results/
          if-no-files-found: warn
