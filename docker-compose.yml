services:
  # -------------------------------------------------------------
  # Hephaestus Panel Web UI (Vue 3 + Vite + Tailwind CSS on Nginx Alpine)
  # -------------------------------------------------------------
  panel:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      network: host
      args:
        REGISTRY_MIRROR: ${REGISTRY_MIRROR:-public.ecr.aws/docker/library/}
    container_name: hephaestus-panel
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - engine
    networks:
      - hephaestus_net

  # -------------------------------------------------------------
  # Hephaestus Engine (Go 1.22 REST/WebSocket API + Worker Pool + Scheduler)
  # -------------------------------------------------------------
  engine:
    build:
      context: .
      dockerfile: Dockerfile.backend
      network: host
      args:
        REGISTRY_MIRROR: ${REGISTRY_MIRROR:-public.ecr.aws/docker/library/}
    container_name: hephaestus-engine
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - PORT=5000
      - APP_ENV=production
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=${DB_USER:-hephaestus}
      - DB_PASSWORD=${DB_PASSWORD:-hephaestus_secret}
      - DB_NAME=${DB_NAME:-hephaestus}
      - DB_SSL=false
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - LOGS_DIR=/app/logs
      - DATA_DIR=/app/data
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - app_backups:/app/backups
    depends_on:
      - database
    networks:
      - hephaestus_net

  # -------------------------------------------------------------
  # Hephaestus Database (PostgreSQL 16 Enterprise Storage)
  # -------------------------------------------------------------
  database:
    image: ${REGISTRY_MIRROR:-public.ecr.aws/docker/library/}postgres:16-alpine
    container_name: hephaestus-database
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-hephaestus}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-hephaestus_secret}
      - POSTGRES_DB=${DB_NAME:-hephaestus}
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - hephaestus_net

networks:
  hephaestus_net:
    driver: bridge

volumes:
  pg_data:
  app_data:
  app_logs:
  app_backups:
