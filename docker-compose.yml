services:
  # -------------------------------------------------------------
  # Hephaestus Panel Web UI (Vue 3 + Vite + Tailwind CSS on Nginx Alpine)
  # -------------------------------------------------------------
  panel:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REGISTRY_MIRROR: ${REGISTRY_MIRROR:-}
    container_name: hephaestus-panel
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - TZ=${TZ:-Asia/Jakarta}
    volumes:
      - ./certs:/etc/nginx/certs
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - engine
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hephaestus_net

  # -------------------------------------------------------------
  # Hephaestus Engine (Go 1.22 REST/WebSocket API + Worker Pool + Scheduler)
  # -------------------------------------------------------------
  engine:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        REGISTRY_MIRROR: ${REGISTRY_MIRROR:-}
    container_name: hephaestus-engine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5000"
    environment:
      - PORT=5000
      - APP_ENV=production
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=${DB_USER:-hephaestus}
      - DB_PASSWORD=${DB_PASSWORD:-hephaestus_secret}
      - DB_NAME=${DB_NAME:-hephaestus}
      - DB_SSL=false
      - DB_MAX_CONNS=${DB_MAX_CONNS:-25}
      - DB_MIN_CONNS=${DB_MIN_CONNS:-5}
      - DB_MAX_CONN_IDLE_TIME=${DB_MAX_CONN_IDLE_TIME:-600}
      - DB_MAX_CONN_LIFETIME=${DB_MAX_CONN_LIFETIME:-3600}
      - GOMEMLIMIT=${GOMEMLIMIT:-512MiB}
      - GOGC=${GOGC:-80}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-}
      - LOGS_DIR=/app/logs
      - DATA_DIR=/app/data
      - TZ=${TZ:-Asia/Jakarta}
    security_opt:
      - no-new-privileges:true
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - ${BACKUP_DIR:-./backups}:/app/backups
      - ${BACKUP_DIR:-./backups}:/opt/backups
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - database
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"
    networks:
      - hephaestus_net

  # -------------------------------------------------------------
  # Hephaestus Database (PostgreSQL 16 Enterprise Storage)
  # -------------------------------------------------------------
  database:
    image: ${REGISTRY_MIRROR:-}postgres:16-alpine
    container_name: hephaestus-database
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-8MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-32MB}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"
      - "-c"
      - "wal_buffers=${POSTGRES_WAL_BUFFERS:-8MB}"
    environment:
      - POSTGRES_USER=${DB_USER:-hephaestus}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-hephaestus_secret}
      - POSTGRES_DB=${DB_NAME:-hephaestus}
      - TZ=${TZ:-Asia/Jakarta}
    ports:
      # Bind to localhost (127.0.0.1) only by default to prevent exposure to external network (HCP-SEC-002)
      - "127.0.0.1:${DB_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hephaestus_net

networks:
  hephaestus_net:
    driver: bridge

volumes:
  pg_data:
  app_data:
  app_logs:
